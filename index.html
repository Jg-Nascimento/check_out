<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Pro | Finalizar Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --glass-stroke: rgba(255, 255, 255, 0.15);
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
        }

        body {
            background: #050505;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.15) 0px, transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .glass-container {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--glass-stroke);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px var(--accent-glow);
            outline: none;
        }

        .btn-glow {
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-glow:hover {
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-2px);
        }

        select option { background: #111; color: white; }
    </style>
</head>
<body>

<div class="glass-container w-full max-w-xl p-6 md:p-10">
    <div class="flex justify-between items-start mb-8">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white">Checkout</h1>
            <p class="text-slate-400 mt-1">Conclua a sua encomenda em segundos</p>
        </div>
        <div class="bg-white/10 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest text-accent border border-white/10">
            Seguro & Encriptado
        </div>
    </div>

    <!-- Produto -->
    <div class="mb-8 p-5 rounded-2xl bg-gradient-to-br from-white/5 to-transparent border border-white/5 relative">
        <div class="flex justify-between items-center gap-4">
            <div class="flex-1">
                <span class="text-[10px] text-cyan-400 font-bold uppercase mb-1 block">Produto Selecionado</span>
                <h3 id="prod-nome" class="text-xl font-bold text-white truncate">Carregando...</h3>
                <p id="prod-preco-unit" class="text-sm text-slate-400">R$ 0,00</p>
            </div>
            
            <div class="flex flex-col items-center bg-black/40 p-3 rounded-xl border border-white/10">
                <span class="text-[9px] uppercase font-bold text-slate-500 mb-2">Quantidade</span>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="changeQty(-1)" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center border border-white/10 text-white transition-colors">-</button>
                    <input type="number" id="quantidade" value="1" min="1" readonly class="bg-transparent w-8 text-center font-bold text-lg outline-none text-white">
                    <button type="button" onclick="changeQty(1)" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center border border-white/10 text-white transition-colors">+</button>
                </div>
            </div>
        </div>
    </div>

    <form id="orderForm" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 ml-1">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Ex: João Silva" class="input-field w-full p-4 rounded-2xl text-white">
            </div>
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 ml-1">Telemóvel / WhatsApp</label>
                <input type="tel" id="contato" required placeholder="(83) 9 9999-9999" class="input-field w-full p-4 rounded-2xl text-white">
            </div>
        </div>

        <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-400 ml-1">Endereço de Entrega</label>
            <input type="text" id="endereco" required placeholder="Rua, Número, Bairro e Cidade" class="input-field w-full p-4 rounded-2xl text-white">
        </div>

        <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-400 ml-1">Método de Pagamento</label>
            <select id="pagamento" required class="input-field w-full p-4 rounded-2xl text-white appearance-none cursor-pointer">
                <option value="" disabled selected>Selecione uma opção...</option>
                <option value="Pix">Pix</option>
                <option value="Cartão">Cartão</option>
                <option value="Dinheiro">Dinheiro</option>
            </select>
        </div>

        <div class="mt-8 pt-6 border-t border-white/10 space-y-3">
            <div class="flex justify-between text-sm text-slate-400">
                <span>Subtotal</span>
                <span id="subtotal">R$ 0,00</span>
            </div>
            <div class="flex justify-between text-sm text-slate-400">
                <span>Taxa de Entrega</span>
                <span class="text-green-400 font-bold">GRÁTIS</span>
            </div>
            <div class="flex justify-between items-end pt-2">
                <span class="text-lg font-bold text-white">Total a Pagar</span>
                <span id="valor-total" class="text-3xl font-black text-white">0,00 R$</span>
            </div>
        </div>

        <button type="submit" class="btn-glow w-full py-5 bg-white text-black font-black rounded-2xl uppercase tracking-tighter text-lg flex items-center justify-center gap-3">
            <span>ENVIAR PEDIDO</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const itemData = {
        desc: urlParams.get('item') || "Produto não identificado",
        preco: parseFloat(urlParams.get('preco')) || 0.00
    };

    const elements = {
        qtd: document.getElementById('quantidade'),
        total: document.getElementById('valor-total'),
        subtotal: document.getElementById('subtotal'),
        nomeProd: document.getElementById('prod-nome'),
        precoUnit: document.getElementById('prod-preco-unit')
    };

    function updatePrices() {
        const qtd = parseInt(elements.qtd.value);
        const total = (itemData.preco * qtd).toFixed(2).replace('.', ',');
        elements.total.innerText = `${total} R$`;
        elements.subtotal.innerText = `${total} R$`;
    }

    function changeQty(val) {
        let current = parseInt(elements.qtd.value);
        if (current + val >= 1) {
            elements.qtd.value = current + val;
            updatePrices();
        }
    }

    window.onload = () => {
        elements.nomeProd.innerText = itemData.desc;
        elements.precoUnit.innerText = `Valor Unitário: R$ ${itemData.preco.toFixed(2).replace('.', ',')}`;
        updatePrices();
    };

    // Máscara de Telefone
    document.getElementById('contato').addEventListener('input', (e) => {
        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
        e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
    });

    document.getElementById('orderForm').onsubmit = (e) => {
        e.preventDefault();
        const qtd = elements.qtd.value;
        const total = (itemData.preco * qtd).toFixed(2);
        
        const mensagem = `*NOVO PEDIDO*\n-----------------\nPRODUTO: ${itemData.desc}\nQTD: ${qtd}\nTOTAL: R$ ${total.replace('.', ',')}\n-----------------\nCLIENTE: ${document.getElementById('nome').value}\nTEL: ${document.getElementById('contato').value}\nEND: ${document.getElementById('endereco').value}\nPAGAMENTO: ${document.getElementById('pagamento').value}`;
        
        window.open(`https://api.whatsapp.com/send?phone=558399999999&text=${encodeURIComponent(mensagem)}`, '_blank');
    };
</script>
</body>
</html>
